version: '3.8'

services:
  service1:
    build:
      context: .
      dockerfile: Service1/Dockerfile
    ports:
      - "5001:80"
    networks:
      - mynetwork

  service2:
    build:
      context: .
      dockerfile: Service2/Dockerfile
    ports:
      - "5002:80"
    networks:
      - mynetwork

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - service1
      - service2
    volumes:
      - ./Nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - mynetwork

networks:
  mynetwork:
    external: true
